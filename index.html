<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite Element Admin</title>
    <style>
      #loader-wrapper {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(45deg, #5a3694, #13bdce, #0094d9, #6fc7b5);
        background-size: 400% 400%;
        animation: gradient 7.5s ease-in-out infinite;
      }
      @keyframes gradient {
        0%,
        100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      #loader {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        animation: spin 1.2s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loader-text {
        margin-top: 20px;
        color: #fff;
        font-size: 16px;
        letter-spacing: 4px;
        -webkit-user-select: none;
        user-select: none;
      }
      #app:not(:empty) ~ #loader-wrapper,
      body.vue-ready #loader-wrapper {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loader-wrapper">
      <div id="loader"></div>
      <div class="loader-text">LOADING</div>
    </div>
    <!-- echarts-gl 会在注册 3D 组件时 console.warn('geo3D exists')，功能正常但污染控制台 -->
    <!-- 在 Vite ESM 入口之前拦截 console.warn 过滤掉 -->
    <script>
      ;(function () {
        var _origWarn = console.warn
        var _patterns = [
          'geo3D exists',
          'geo3DView exists',
          'scatter3D exists',
          'bar3D exists',
          'line3D exists',
          'lines3D exists',
          'map3D exists',
          'surface exists',
          'mapboxLayer exists',
          'globe exists',
        ]
        console.warn = function () {
          var msg = Array.prototype.join.call(arguments, ' ')
          for (var i = 0; i < _patterns.length; i++) {
            if (msg.indexOf(_patterns[i]) !== -1) return
          }
          _origWarn.apply(console, arguments)
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
